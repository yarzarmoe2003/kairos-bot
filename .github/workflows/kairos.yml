name: KAIROS
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: {}
concurrency:
  group: kairos-cycle
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run one decision cycle
        env:
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASS: ${{ secrets.OKX_PASS }}
        run: node kairos-cron.js
      - name: Persist state
        run: |
          date -u > heartbeat.txt
          git config user.name "kairos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "state sync $(date -u +%FT%TZ)"
          git push
